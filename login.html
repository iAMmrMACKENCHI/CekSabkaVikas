<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login — Physics with Vikas</title>
<link rel="manifest" href="manifest.json"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
  *{font-family:'Space Grotesk',sans-serif}
  .hero-font{font-family:'Syne',sans-serif}
  .grad{background:linear-gradient(135deg,#0f172a 0%,#0c2340 60%,#0f2c50 100%)}
  .input-field{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);color:#fff;border-radius:1rem;padding:14px 16px;width:100%;font-size:15px;outline:none;transition:border .2s}
  .input-field:focus{border-color:#0284C7;background:rgba(2,132,199,0.08)}
  .input-field::placeholder{color:rgba(255,255,255,0.3)}
</style>
</head>
<body class="grad min-h-screen text-white">
<div class="max-w-sm mx-auto px-6 pt-10 pb-24">

  <a href="index.html" class="flex items-center gap-2 text-slate-400 text-sm mb-8 hover:text-white transition">← Back</a>

  <div class="text-center mb-8">
    <div class="w-14 h-14 rounded-2xl bg-sky-500/20 border border-sky-500/30 flex items-center justify-center text-3xl mx-auto mb-4">⚛</div>
    <h1 class="hero-font text-2xl font-extrabold mb-1">Welcome Back</h1>
    <p class="text-slate-400 text-sm">Login with your phone number</p>
  </div>

  <form id="loginForm" class="space-y-4">
    <div>
      <label class="text-xs text-slate-400 mb-1.5 block font-semibold uppercase tracking-wide">Phone Number</label>
      <input type="tel" id="phone" class="input-field" placeholder="10-digit mobile" maxlength="10" required/>
    </div>
    <div>
      <label class="text-xs text-slate-400 mb-1.5 block font-semibold uppercase tracking-wide">Name</label>
      <input type="text" id="name" class="input-field" placeholder="As used during signup" required/>
    </div>
    <button type="submit" id="loginBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-bold py-4 rounded-2xl text-base transition" style="box-shadow:0 0 30px rgba(2,132,199,0.4)">
      Login →
    </button>
  </form>

  <!-- NOTE: In production this would validate against Google Sheet via Apps Script -->
  <div class="mt-6 bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 text-xs text-amber-300">
    ⚠️ Demo mode: Any name + phone will log you in. Connect Apps Script to validate against your Users sheet.
  </div>

  <p class="text-center text-slate-400 text-sm mt-6">
    New here? <a href="signup.html" class="text-sky-400 font-semibold hover:text-sky-300">Create Account</a>
  </p>
</div>

<script src="script.js"></script>
<script>
if(Auth.getUser()) window.location.href="dashboard.html";

document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const phone = document.getElementById("phone").value.trim();
  const name = document.getElementById("name").value.trim();

  if(phone.length !== 10){showToast("Invalid phone number","error");return;}

  setLoading(btn,true);

  // Production: validate against sheet
  // const result = await postToSheet("login", {phone, name});
  // if(!result.found){showToast("User not found","error");setLoading(btn,false);return;}

  // Demo: trust the user
  Auth.setUser({ name, phone, email: "", class: "11", hasAccess: false });
  showToast("Login successful! 👋","success");
  setTimeout(()=> window.location.href="dashboard.html", 1000);
});
</script>
</body>
</html>
