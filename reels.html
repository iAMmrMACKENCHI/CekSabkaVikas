<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reels — Physics with Vikas</title>
<link rel="manifest" href="manifest.json"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
  *{font-family:'Space Grotesk',sans-serif;box-sizing:border-box;margin:0;padding:0}
  .hero-font{font-family:'Syne',sans-serif}
  html,body{height:100%;overflow:hidden;background:#0a0f1a;color:#fff}
  #reelsContainer{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
  #reelsContainer::-webkit-scrollbar{display:none}
  .reel-slide{height:100dvh;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;background:#0a0f1a}
  .reel-iframe{width:100%;flex:1;border:none;background:#000}
  .reel-info{position:absolute;bottom:0;left:0;right:0;padding:20px 16px 90px;background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,transparent 100%)}
  .tag{display:inline-block;background:rgba(2,132,199,0.25);border:1px solid rgba(2,132,199,0.4);color:#7dd3fc;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600}
  .diff-badge{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
  .easy{background:rgba(34,197,94,0.2);color:#86efac}
  .medium{background:rgba(251,191,36,0.2);color:#fde68a}
  .hard{background:rgba(239,68,68,0.2);color:#fca5a5}

  .cta-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .cta-card{background:#0f172a;border:1px solid rgba(2,132,199,0.3);border-radius:1.5rem;padding:28px 24px;max-width:320px;width:90%;text-align:center}
  .close-btn{position:absolute;top:12px;right:16px;font-size:22px;color:#94a3b8;cursor:pointer}

  .nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px;border-radius:12px}
  .progress-dots{display:flex;gap:5px;justify-content:center;padding:6px 0 2px}
  .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2)}
  .dot.active{background:#0284C7;width:18px;border-radius:3px}
</style>
</head>
<body>

<!-- Top bar -->
<div style="position:fixed;top:0;left:0;right:0;z-index:40;padding:12px 16px;background:linear-gradient(to bottom,rgba(10,15,26,0.9),transparent);display:flex;align-items:center;justify-between">
  <a href="dashboard.html" style="color:#94a3b8;font-size:13px">← Back</a>
  <span class="hero-font" style="font-size:15px;font-weight:700;color:#fff">Physics Reels</span>
  <span id="reelCounter" style="color:#0284C7;font-size:13px;font-weight:600">1 / 8</span>
</div>

<!-- Progress dots -->
<div id="progressDots" class="progress-dots" style="position:fixed;top:48px;left:0;right:0;z-index:40"></div>

<!-- Reels container -->
<div id="reelsContainer"></div>

<!-- CTA overlay (shows every 3 reels) -->
<div class="cta-overlay" id="ctaOverlay" style="display:none">
  <div class="cta-card" style="position:relative">
    <span class="close-btn" onclick="closeCTA()">✕</span>
    <div style="font-size:36px;margin-bottom:12px">🚀</div>
    <h3 class="hero-font" style="font-size:18px;font-weight:800;margin-bottom:8px;color:#fff">Want More?</h3>
    <p style="color:#94a3b8;font-size:13px;margin-bottom:20px;line-height:1.5">Get the full lecture series with solved examples and PYQs!</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      <a href="course-detail.html" style="background:#0284C7;color:#fff;font-weight:700;padding:14px;border-radius:14px;text-decoration:none;display:block;font-size:14px">
        📚 View Full Course
      </a>
      <button onclick="closeCTA()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#94a3b8;font-weight:600;padding:14px;border-radius:14px;font-size:14px;cursor:pointer;width:100%">
        Continue Watching Reels
      </button>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<nav style="position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(10,17,30,0.95);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,0.06);padding:4px 8px 8px">
  <div style="display:flex;justify-content:space-around;max-width:360px;margin:0 auto">
    <a href="dashboard.html" data-nav="dashboard.html" class="nav-item" style="color:#64748b">
      <span style="font-size:20px">🏠</span><span style="font-size:10px;font-weight:600">Home</span>
    </a>
    <a href="reels.html" data-nav="reels.html" class="nav-item" style="color:#38bdf8">
      <span style="font-size:20px">🎬</span><span style="font-size:10px;font-weight:600">Reels</span>
    </a>
    <a href="course.html" data-nav="course.html" class="nav-item" style="color:#64748b">
      <span style="font-size:20px">📚</span><span style="font-size:10px;font-weight:600">Courses</span>
    </a>
    <a href="profile.html" data-nav="profile.html" class="nav-item" style="color:#64748b">
      <span style="font-size:20px">👤</span><span style="font-size:10px;font-weight:600">Profile</span>
    </a>
  </div>
</nav>

<script src="script.js"></script>
<script>
const DIFF_ICONS = {Easy:"🟢",Medium:"🟡",Hard:"🔴"};

let reels = [];
let currentIndex = 0;
const CTA_INTERVAL = 3;

function buildProgressDots(total){
  const c = document.getElementById("progressDots");
  c.innerHTML = reels.slice(0,Math.min(total,12)).map((_,i)=>`<div class="dot ${i===0?'active':''}" id="dot${i}"></div>`).join("");
}

function updateDots(idx){
  document.querySelectorAll(".dot").forEach((d,i)=>{
    d.classList.toggle("active",i===idx);
  });
  document.getElementById("reelCounter").textContent=`${idx+1} / ${reels.length}`;
}

function buildReelSlide(reel, index){
  const div = document.createElement("div");
  div.className = "reel-slide";
  div.id = `slide-${index}`;
  div.innerHTML = `
    <iframe class="reel-iframe" src="${reel.videoUrl}?autoplay=0&rel=0&modestbranding=1" 
      allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" 
      allowfullscreen loading="lazy"></iframe>
    <div class="reel-info">
      <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
        <span class="tag">${reel.class === "11" ? "Class 11" : reel.class === "12" ? "Class 12" : reel.class}</span>
        ${reel.tags.slice(0,2).map(t=>`<span class="tag">${t}</span>`).join("")}
        <span class="diff-badge ${reel.difficulty.toLowerCase()}">${DIFF_ICONS[reel.difficulty]} ${reel.difficulty}</span>
      </div>
      <h3 class="hero-font" style="font-size:18px;font-weight:800;margin-bottom:4px">${reel.topic}</h3>
      <p style="font-size:12px;color:rgba(255,255,255,0.5)">${reel.class === "11" ? "Class 11" : "Class 12"} Physics</p>
      <a href="watch.html?id=${reel.id}" style="display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:rgba(2,132,199,0.2);border:1px solid rgba(2,132,199,0.4);color:#7dd3fc;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;text-decoration:none">
        ▶ Watch Full Video
      </a>
    </div>
  `;
  return div;
}

async function init(){
  const u = Auth.getUser();
  reels = await fetchReels(u?.class);
  const container = document.getElementById("reelsContainer");

  reels.forEach((r,i)=>{
    container.appendChild(buildReelSlide(r,i));
  });
  buildProgressDots(reels.length);

  // Scroll-snap observer
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const idx = parseInt(e.target.id.replace("slide-",""));
        currentIndex = idx;
        updateDots(idx);
        if(idx>0 && idx % CTA_INTERVAL === 0){
          setTimeout(()=> document.getElementById("ctaOverlay").style.display="flex", 600);
        }
      }
    });
  },{threshold:0.6});

  document.querySelectorAll(".reel-slide").forEach(s=>observer.observe(s));
}

function closeCTA(){
  document.getElementById("ctaOverlay").style.display="none";
}

init();
</script>
</body>
</html>
